toss:
  live_enabled: false
  # Fill this locally. Do not commit config/local.yaml.
  account_seq: ""
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET

ai:
  enabled: false
  provider: openai_compatible
  model: bRadu/gemma-4-E2B-it-textonly
  base_url: http://localhost:8000/v1
  api_key_env: TURTLE_AI_API_KEY
  timeout_seconds: 30
  max_tokens: 700
  temperature: 0.2

runtime:
  # Use paper for virtual-only forward tests.
  # Use shadow for real read-only account/market validation with virtual fills.
  mode: shadow
  market: US
  timezone: America/New_York
  use_market_calendar: true
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  candle_interval: 1d
  # Momentum needs at least lookback_days + skip_days + MA warmup.
  candle_count: 320
  exclude_current_session: true
  watchlist_enabled: true
  watchlist_top_n: 20
  watchlist_name: premarket
  universe_enabled: false
  universe_candidate_symbols: []
  universe_include_etfs: true
  universe_min_price: 5
  universe_min_average_daily_value: 50000000
  universe_min_completed_candles: 275
  # Start with a small liquid list. Replace with your own candidate universe.
  symbols:
    - QQQ
    - SPY
    - XLK
    - SMH
    - NVDA
    - MSFT
    - AAPL
    - AVGO
    - AMD
    - META

strategy:
  kind: momentum
  minimum_tick: 0.01
  n_method: turtle
  momentum:
    market_symbol: SPY
    lookback_days: 252
    skip_days: 21
    trend_ma_days: 200
    exit_ma_days: 100
    max_positions: 10
    accept_top_n: 3
    target_position_pct: 0.10
    min_price: 5
    min_average_daily_value: 50000000
    average_daily_value_days: 20
    use_market_filter: true
  risk:
    risk_pct_per_unit: 0.005
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units_per_symbol: 4
    max_total_long_units: 12
