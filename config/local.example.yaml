toss:
  live_enabled: false
  account_seq: ''
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET
  require_live_consent: false
  allowed_live_consent_ids: []
live:
  emergency_stop: true
  allowed_symbols: []
  max_order_quantity: 1
  max_order_notional:
  daily_order_count_limit: 1
  daily_notional_limit:
  require_market_open: true
  require_clean_reconcile: true
  block_unresolved_orders: true
  confirm_high_value_order: false
  cancel_after_ack: false
  max_consecutive_order_failures: 3
ai:
  enabled: false
  provider: openai_compatible
  model: bRadu/gemma-4-E2B-it-textonly
  base_url: http://localhost:8000/v1
  api_key_env: TURTLE_AI_API_KEY
  timeout_seconds: 30
  max_tokens: 700
  temperature: 0.2
runtime:
  mode: shadow
  market: US
  timezone: America/New_York
  use_market_calendar: true
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  candle_interval: 1d
  candle_count: 320
  exclude_current_session: true
  watchlist_enabled: true
  watchlist_top_n: 20
  watchlist_name: premarket
  universe_enabled: false
  universe_candidate_symbols: []
  universe_include_etfs: true
  universe_min_price: 5
  universe_min_average_daily_value: 50000000
  universe_min_completed_candles: 275
  symbols:
  - QQQ
  - SPY
  - XLK
  - SMH
  - NVDA
  - MSFT
  - AAPL
  - AVGO
  - AMD
  - META
strategy:
  # For the separate shadow-only intraday planner, use intraday.example.yaml.
  kind: momentum
  minimum_tick: 0.01
  n_method: turtle
  momentum:
    market_symbol: SPY
    lookback_days: 126
    skip_days: 21
    trend_ma_days: 200
    exit_ma_days: 75
    max_positions: 5
    cash_reserve_pct: 0.1
    accept_top_n: 2
    target_position_pct: 0.1
    min_price: 5
    min_average_daily_value: 50000000
    average_daily_value_days: 20
    use_market_filter: true
    max_exposure_pct: 0.9
  risk:
    risk_pct_per_unit: 0.005
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units_per_symbol: 4
    max_total_long_units: 12
