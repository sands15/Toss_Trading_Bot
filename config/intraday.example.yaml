# Fail-closed template for the US premarket intraday planner.
# This file contains no recommended symbol or risk/return values.  Fill every
# null explicitly after reviewing docs/intraday-bracket-design.md.
toss:
  live_enabled: false
  # Human-readable only; required when exporting a Discord approval envelope.
  account_alias:
  account_seq:
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET

runtime:
  mode: shadow
  market: US
  timezone: America/New_York
  use_market_calendar: true
  # Automatic selection requires this to stay empty. Manual fallback requires
  # exactly one symbol and selection.mode: manual.
  symbols: []
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  watchlist_enabled: false
  universe_enabled: false

strategy:
  kind: intraday
  intraday:
    # Fractions use decimal ratios: 0.01 means 1%.
    cash_allocation_fraction:
    risk_fraction:
    take_profit_fraction:
    stop_fraction:
    stop_limit_buffer_fraction:
    max_entry_slippage_fraction:
    # Must cover at least two times the active Toss US commission rate.
    estimated_round_trip_cost_fraction:
    # Fixed per-trade reserve for minimum/regulatory fees, in USD (zero allowed).
    estimated_fixed_round_trip_cost:
    # Evaluated after US tick rounding and the configured cost reserve.
    minimum_reward_risk_ratio:
    max_spread_fraction:
    max_last_mid_deviation_fraction:
    max_notional:
    max_quantity: 1

    # The planner runs only from regular_open-plan_lead_minutes through
    # regular_open-minimum_plan_lead_minutes.  Choose both explicitly.
    plan_lead_minutes:
    minimum_plan_lead_minutes:
    quote_max_age_seconds:
    orderbook_max_age_seconds:
    max_quote_skew_seconds:

    entry_start_minutes_after_open:
    entry_expiry_minutes_after_open:
    force_exit_minutes_before_close:
    regular_session_only: true
    selection:
      # Candidate source is Toss US MARKET_TRADING_AMOUNT/realtime. It is not
      # documented as premarket-only. The shadow policy intersects the top 20
      # with NASDAQ/NYSE/AMEX common stocks and reviews at most the first 5.
      # Ranking is never sufficient by itself: the planner rechecks metadata,
      # warnings, completed daily candles, current premarket 1m candles,
      # current price and orderbook before locking exactly one symbol.
      mode: automatic
      rank_max_age_seconds: 120
      min_price: 5
      min_trading_amount: 1000000
      min_change_fraction: 0.005
      max_change_fraction: 0.08
      min_average_daily_value: 50000000
      max_average_daily_range_fraction: 0.08
      max_premarket_range_fraction: 0.05
    # This version deliberately has no live intraday execution engine.
    live_execution_enabled: false
    # Redacted one-symbol handoff shared read-only by the isolated news worker
    # and shadow market stream. Prefer one absolute private path outside the
    # Git checkout on the MacBook; the planner remains its only writer.
    news_context_path: ../state/news-context.json
    # Redacted immutable plan handoff for the isolated Discord approval worker.
    # The worker writes approvals to a separate inbox and never opens trading DB.
    approval_envelope_path: ../state/approval-envelope.json

    # Forward-test only. When enabled, position sizing uses this isolated USD
    # ledger instead of Toss buying power. The selected-symbol websocket feeds
    # virtual fills; no broker order endpoint is available to this path.
    simulation:
      enabled: false
      id:
      start_date:
      end_date:
      initial_cash: 10000
      # Conservative 5 bps adverse price movement on each virtual fill.
      slippage_fraction: 0.0005
      db_path: ../state/intraday-paper.sqlite3

live:
  emergency_stop: true
  allowed_symbols: []
