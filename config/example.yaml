toss:
  live_enabled: false
  account_seq:
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET

ai:
  enabled: false
  provider: openai_compatible
  model: bRadu/gemma-4-E2B-it-textonly
  base_url: http://localhost:8000/v1
  api_key_env: TURTLE_AI_API_KEY
  timeout_seconds: 30
  max_tokens: 700
  temperature: 0.2

runtime:
  mode: paper
  market: KR
  timezone: Asia/Seoul
  use_market_calendar: true
  symbols: []
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  candle_interval: 1d
  candle_count: 100
  exclude_current_session: true
  watchlist_enabled: true
  watchlist_top_n: 20
  watchlist_name: premarket
  universe_enabled: false
  universe_candidate_symbols: []
  universe_include_etfs: false
  universe_min_price: 1000
  universe_min_average_daily_value: 100000000
  universe_min_completed_candles: 56

strategy:
  minimum_tick: 1
  n_method: turtle
  risk:
    risk_pct_per_unit: 0.007
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units_per_symbol: 4
    max_total_long_units: 12
