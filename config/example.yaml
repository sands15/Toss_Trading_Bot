toss:
  live_enabled: false
  # Set account_seq in this file only (number/string). No secret value here.
  account_seq:
  # Environment variable names for Toss credentials.
  # Keep these values in your shell/OS profile or process manager.
  # Do not write real client keys in this file.
  # Default values are used when omitted.
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET

live:
  # Final live-order safety gates. These are checked immediately before Toss
  # order submission and are separate from strategy sizing.
  emergency_stop: true
  allowed_symbols: []
  max_order_quantity: 1
  max_order_notional:
  daily_order_count_limit: 1
  daily_notional_limit:
  require_market_open: true
  require_clean_reconcile: true
  block_unresolved_orders: true
  confirm_high_value_order: false
  cancel_after_ack: false

ai:
  enabled: false
  provider: openai_compatible
  model: bRadu/gemma-4-E2B-it-textonly
  base_url: http://localhost:8000/v1
  api_key_env: TURTLE_AI_API_KEY
  timeout_seconds: 30
  max_tokens: 700
  temperature: 0.2

runtime:
  # paper: forward-test with virtual fills.
  # shadow: real read-only account/market validation with virtual fills and no live orders.
  # live: real Toss order submission after safety gates pass.
  #       Requires toss.live_enabled: true and a tiny allowlisted pilot setup.
  mode: paper
  market: KR
  timezone: Asia/Seoul
  use_market_calendar: true
  symbols: []
# You can also provide universe candidates and enable universe mode.
# runtime.universe_enabled: false
# runtime.universe_candidate_symbols: []
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  candle_interval: 1d
  # Momentum runtime needs at least lookback_days + skip_days + MA warmup.
  candle_count: 320
  exclude_current_session: true
  watchlist_enabled: true
  watchlist_top_n: 20
  watchlist_name: premarket
  universe_enabled: false
  universe_candidate_symbols: []
  universe_include_etfs: false
  universe_min_price: 1000
  universe_min_average_daily_value: 100000000
  universe_min_completed_candles: 56

strategy:
  # turtle keeps the original Turtle signal runtime.
  # momentum enables the saved US relative-strength momentum runtime.
  kind: turtle
  minimum_tick: 1
  n_method: turtle
  momentum:
    market_symbol: SPY
    lookback_days: 126
    skip_days: 21
    trend_ma_days: 200
    exit_ma_days: 75
    max_positions: 5
    # Minimum cash reserve. 0.50 means keep at least 50% cash.
    cash_reserve_pct: 0.50
    accept_top_n: 2
    target_position_pct: 0.10
    min_price: 5
    min_average_daily_value: 50000000
    average_daily_value_days: 20
    use_market_filter: true
  risk:
    risk_pct_per_unit: 0.007
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units_per_symbol: 4
    max_total_long_units: 12
