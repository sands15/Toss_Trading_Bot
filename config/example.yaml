toss:
  live_enabled: false
  account_seq:
  client_id_env: TOSS_CLIENT_ID
  client_secret_env: TOSS_CLIENT_SECRET

runtime:
  mode: paper
  market: KR
  timezone: Asia/Seoul
  use_market_calendar: true
  symbols: []
  state_db: state/turtle.sqlite3
  log_dir: logs
  interval_seconds: 60
  candle_interval: 1d
  candle_count: 100
  exclude_current_session: true

strategy:
  minimum_tick: 1
  n_method: turtle
  risk:
    risk_pct_per_unit: 0.007
    stop_n: 2.0
    pyramid_step_n: 0.5
    max_units_per_symbol: 4
    max_total_long_units: 12
